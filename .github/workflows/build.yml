name: Build and publish pre-release

on:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build release APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Move fixed tag and update pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: pre-release
        shell: bash
        run: |
          set -euo pipefail

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME}" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG_NAME}" \
              -f sha="${GITHUB_SHA}" -F force=true >/dev/null
          fi

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release edit "${TAG_NAME}" \
              --title "pre-release" \
              --notes "Automated build from ${GITHUB_SHA}." \
              --prerelease \
              --target "${GITHUB_SHA}"
          else
            gh release create "${TAG_NAME}" \
              --target "${GITHUB_SHA}" \
              --title "pre-release" \
              --notes "Automated build from ${GITHUB_SHA}." \
              --prerelease
          fi

          gh release upload "${TAG_NAME}" app/build/outputs/apk/release/*.apk --clobber
