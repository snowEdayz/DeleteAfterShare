name: Build and publish pre-release

on:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          signing_dir="$RUNNER_TEMP/deleteaftershare-signing"
          mkdir -p "$signing_dir"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$signing_dir/release.p12"
          chmod 600 "$signing_dir/release.p12"

          test -s "$signing_dir/release.p12"
          {
            echo "RELEASE_STORE_FILE=$signing_dir/release.p12"
            echo "RELEASE_STORE_TYPE=pkcs12"
            echo "RELEASE_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Verify release APK signature
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify app/build/outputs/apk/release/app-release.apk

      - name: Move fixed tag and update pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: pre-release
        shell: bash
        run: |
          set -euo pipefail

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME}" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG_NAME}" \
              -f sha="${GITHUB_SHA}" -F force=true >/dev/null
          fi

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release edit "${TAG_NAME}" \
              --title "pre-release" \
              --notes "Automated build from ${GITHUB_SHA}." \
              --prerelease \
              --target "${GITHUB_SHA}"
          else
            gh release create "${TAG_NAME}" \
              --target "${GITHUB_SHA}" \
              --title "pre-release" \
              --notes "Automated build from ${GITHUB_SHA}." \
              --prerelease
          fi

          gh release upload "${TAG_NAME}" app/build/outputs/apk/release/app-release.apk --clobber
