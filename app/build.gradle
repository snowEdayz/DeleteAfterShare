plugins {
    id "com.android.application"
}

def releaseStoreFile = System.getenv("RELEASE_STORE_FILE")
def releaseSigningConfigured = releaseStoreFile != null && !releaseStoreFile.trim().isEmpty()

android {
    namespace "com.deleteaftershare"
    compileSdk 35

    defaultConfig {
        applicationId "com.deleteaftershare"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile file(releaseStoreFile)
                storeType System.getenv("RELEASE_STORE_TYPE") ?: "pkcs12"
                storePassword System.getenv("RELEASE_STORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    compileOnly "de.robv.android.xposed:api:82"
    implementation "org.luckypray:dexkit:2.2.0"
}
